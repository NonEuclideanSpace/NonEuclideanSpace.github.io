<svg xmlns="http://www.w3.org/2000/svg" width="1102" height="976" viewBox="0 0 1102 976" role="img" aria-labelledby="title">
  <title id="title">From the gated feed-forward network to the FLUX.2 text condition</title>
  <style>
    svg { color: #142c4c; }
    text { fill: currentColor; text-anchor: middle; }
    .dim, .token { font: 16px ui-monospace, monospace; }
    .token { text-anchor: start; }
    .math { font: italic 27px "STIX Two Text", Georgia, serif; }
    .small { font: italic 22px "STIX Two Text", Georgia, serif; }
    .op { font-style: normal; }
    .sup { baseline-shift: super; font-size: 16px; font-style: normal; }
    .frame, .flow { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .flow { marker-end: url(#tip); }
    .row { fill: currentColor; fill-opacity: .17; }
    .cell { fill: currentColor; fill-opacity: .78; }
  </style>
  <defs>
