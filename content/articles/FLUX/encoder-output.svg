      <path class="frame" d="M2 1.6 10 6 2 10.4"/>
    </marker>
    <g id="hidden">
      <text class="dim" x="124" y="-11">4096</text>
      <text class="dim" transform="translate(-11 83) rotate(-90)">512</text>
