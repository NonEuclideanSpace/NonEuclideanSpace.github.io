    .head-token { fill: currentColor; opacity: .56; }
    .axis { font: 19px ui-monospace, monospace; }
    .math { font: italic 32px "STIX Two Text", Georgia, serif; }
    .index { font-size: 64%; baseline-shift: -5px; }
    .upper { font-size: 56%; baseline-shift: 10px; }

    .weights, .head-weights { color: #801f2a; }
    .weights { fill-opacity: .12; }
  </style>
