<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 0 1360 934" width="1360" height="934" role="img" aria-labelledby="title">
  <title id="title">Qwen3 linear projections. The dot product of input row t and weight row i gives output element (t, i).</title>
  <style>
    svg { color: #142c4c; }
    text { fill: currentColor; text-anchor: middle; }
    .line, .flow, .pointer, #arrow { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { stroke-width: 2.7; marker-end: url(#flow-tip); }
