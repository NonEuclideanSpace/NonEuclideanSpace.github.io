    <rect class="selected weight" x="148" y="85" width="174" height="14"/>
    <rect class="frame weight" x="148" y="85" width="174" height="182"/>
    <text class="math" x="235" y="184"><tspan fill="#801f2a">W<tspan class="sub">txt</tspan></tspan></text>

    <path class="flow" d="M148 92H73"/>
    <circle class="frame" cx="57" cy="92" r="11"/>
    <circle fill="currentColor" cx="57" cy="92" r="2.5"/>
