<svg xmlns="http://www.w3.org/2000/svg" width="900" height="456" viewBox="0 0 900 456" role="img" aria-labelledby="title">
  <title id="title">Independent text and image modulation projections in the double-stream blocks</title>
  <style>
    svg { color: #142c4c; }
    text { fill: currentColor; text-anchor: middle; }
    .math { font: italic 28px "STIX Two Text", Georgia, serif; }
    .coef { font: italic 21px "STIX Two Text", Georgia, serif; }
    .operator { font: 18px "STIX Two Text", Georgia, serif; }
    .dim { font: 16px ui-monospace, monospace; }
    .sub { font-size: 17px; baseline-shift: sub; font-style: normal; }
    .sup { font-size: 17px; baseline-shift: super; font-style: normal; }
    .frame, .flow, .guide { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .flow { marker-end: url(#tip); }
    .guide { stroke-width: 1.1; stroke-opacity: .55; }
    .selected { fill: currentColor; fill-opacity: .21; }

    .weight { color: #801f2a; }
    .weight.frame { fill: currentColor; fill-opacity: .12; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path class="frame" d="M2 1.6 10 6 2 10.4"/>
    </marker>
  </defs>

  <path class="guide" d="M502 1v7h322V1"/>
  <path class="frame" d="M663 8v20q0 14-14 14H495"/>
  <circle fill="currentColor" cx="495" cy="42" r="2.6"/>
  <path class="flow" d="M495 42H71q-14 0-14 14v20"/>
  <path class="flow" d="M495 42v34"/>

  <g transform="translate(0 0)">
    <text class="dim" x="235" y="72">4096</text>
