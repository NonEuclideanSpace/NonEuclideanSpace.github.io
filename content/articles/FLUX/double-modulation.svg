    <path class="guide" d="M63 313v56"/>
    <text class="math" x="243" y="350">r<tspan fill="#801f2a">W<tspan class="sub">txt</tspan><tspan class="sup">⊤</tspan></tspan></text>

    <path class="guide" d="M51 374v6h62v-6m2 0v6h62v-6m2 0v6h62v-6m2 0v6h62v-6m2 0v6h62v-6m2 0v6h62v-6"/>
    <g class="coef">
