    <rect class="band" x="179" y="51" width="290" height="16"/>
    <text class="rowname" x="184" y="64">p</text>
    <text class="math" x="324" y="95">X<tspan class="sub">attn</tspan></text>
    <text class="dim" transform="translate(167 74.0) rotate(-90)">L</text>
    <text class="dim" x="444" y="34">4096</text>
    <text class="math" x="560" y="42">(b, s, g)<tspan class="sub">MLP, img</tspan></text>
    <path class="wire" d="M559 56v11h61v646q0 9-9 9h-76"/>
    <path class="link" d="M559 68v155q0 8-8 8h-46"/>
    <text class="math op" x="535" y="216">s, b</text>
    <path class="link" d="M190 108v3q0 7-7 7H64q-9 0-9 9v646q0 9 9 9h244"/>
    <path class="link" d="M324 108v20"/>
    <text class="math" x="251" y="152">N =</text>
    <text class="math op" x="354" y="144">X<tspan class="sub">attn</tspan> − μ</text>
    <path class="wire" d="M303 151h102"/>
    <text class="math op" x="357" y="175">√(σ² + ε)</text>
    <path class="link" d="M324 181v17"/>
    <rect class="frame" x="151" y="203" width="346" height="62"/>
    <rect class="band" x="152" y="213" width="344" height="16"/>
    <text class="rowname" x="157" y="226">p</text>
    <text class="math" x="324" y="253">Y = (1 + s) ⊙ N + b</text>
    <path class="link" d="M324 266v57"/>
    <text class="math" x="389" y="298">W<tspan class="sub">up, img</tspan>ᵀ</text>
    <text class="dim" x="513" y="323">24576</text>
    <rect class="frame" x="95" y="330" width="458" height="69"/>
    <rect class="band" x="96" y="341" width="456" height="16"/>
    <rect class="cell" x="248" y="341" width="8" height="16"/>
    <rect class="cell" x="477" y="341" width="8" height="16"/>
    <text class="rowname" x="102" y="354">p</text>
