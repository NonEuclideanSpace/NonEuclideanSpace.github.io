    <text class="math" x="210" y="385">G</text>
    <text class="math" x="440" y="385">U</text>
    <text class="dim" x="256" y="418">12288</text>
    <text class="dim" x="484" y="418">12288</text>
    <path class="link" d="M210 400v34"/>
    <text class="math" x="210" y="458">SiLU(G)</text>
    <path class="link" d="M210 468v6q0 8 8 8h90"/>
    <path class="link" d="M438 400v74q0 8-8 8h-89"/>
    <text class="math" x="324" y="488">⊙</text>
    <path class="link" d="M324 496v12"/>
