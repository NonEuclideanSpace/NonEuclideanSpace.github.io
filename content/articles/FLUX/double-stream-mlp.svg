    <text class="rowname" x="184" y="657">p</text>
    <text class="math" x="324" y="684">D = FW<tspan class="sub">down, img</tspan>ᵀ</text>
    <text class="dim" x="444" y="627">4096</text>
    <path class="link" d="M324 697v18"/>
