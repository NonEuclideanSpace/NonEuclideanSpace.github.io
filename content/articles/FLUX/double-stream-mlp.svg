    <path class="link" d="M536 722H366"/>
    <text class="math op" x="490" y="711">g</text>
    <path class="link" d="M324 745v24"/>
<circle class="port" cx="324" cy="782" r="11"/>
    <path class="wire" d="M319 782h10m-5-5v10"/>
    <path class="link" d="M324 794v15"/>
    <rect class="frame" x="154" y="814" width="340" height="62"/>
    <rect class="band" x="155" y="824" width="338" height="16"/>
    <text class="rowname" x="160" y="837">p</text>
    <text class="math" x="324" y="864">X<tspan class="sub">out</tspan> = X<tspan class="sub">attn</tspan> + g ⊙ D</text>
    <text class="dim" transform="translate(143 845.0) rotate(-90)">L</text>
    <text class="dim" x="468" y="807">4096</text>
  </g>
