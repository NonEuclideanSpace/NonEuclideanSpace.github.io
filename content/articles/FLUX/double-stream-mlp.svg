<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="896" viewBox="0 0 1320 896" role="img" aria-labelledby="title desc">
  <title id="title">The image and text feed-forward sublayers of FLUX.2 double-stream block one</title>
  <desc id="desc">Follow image position p and text token apple through their separate learned weights. Each stream normalizes and time-modulates each token, projects to two equal channel groups, applies SiLU to G and multiplies by U, projects down, gates the result and adds the attention residual. Both streams enter double-stream block two. In the first denoising step reference tokens use the image-stream weights and their fixed time modulation.</desc>
  <style>
    svg { color: #142c4c; }
    text { fill: currentColor; text-anchor: middle; font: 23px "STIX Two Text", Georgia, serif; }
    .math { font-style: italic; }
    .dim, .rowname { font: 15px ui-monospace, monospace; }
    .sub { font-size: 14px; baseline-shift: sub; }
    .op { font-size: 19px; }
    .frame, .link, .wire, .thin { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .link { marker-end: url(#tip); }
    .thin { stroke-width: 1; stroke-opacity: .5; }
    .band { fill: currentColor; opacity: .17; }
    .cell { fill: currentColor; opacity: .60; }
    .port { fill: white; stroke: currentColor; stroke-width: 1.6; }
    .rowname { text-anchor: start; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="wire" d="M2 1.6 10 6 2 10.4"/></marker>
  </defs>
  <g transform="translate(8 0)" aria-label="img MLP">
