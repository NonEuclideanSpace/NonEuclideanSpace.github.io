# Rebuilds the GitHub Pages site from the latest main.
# Triggered on demand with a repository_dispatch event of type "deploy".
name: Request Pages build

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages build
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
