<svg xmlns="http://www.w3.org/2000/svg" width="900" height="478" viewBox="0 398 900 478" role="img" aria-labelledby="title description">
<title id="title">Reference latent packing and denoiser attention interface</title>
<desc id="description">The two-by-two latent pack is standardized with running channel statistics and flattened into reference tokens. FLUX projects each row from 128 to 4096. The reference keys and values are cached per transformer layer during the first denoising step.</desc>
<style>
svg {color:#142c4c} text {fill:currentColor;text-anchor:middle}
.op {font:21px "STIX Two Text",Georgia,serif} .math {font:italic 23px "STIX Two Text",Georgia,serif}
.dim {font:15px ui-monospace,monospace} .sub {font-size:70%;baseline-shift:sub} .sup {font-size:70%;baseline-shift:super}
.frame,.arrow,.guide {fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arrow {marker-end:url(#tip)} .guide {stroke-width:1;opacity:.52}
</style>
<defs><marker id="tip" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="frame" d="M2 1.6 10 6 2 10.4"/></marker></defs>
<path class="arrow" d="M699 407v5q0 8-8 8H138q-8 0-8 8v8"/>
<text class="math" x="130" y="463">μ<tspan class="sub">1</tspan></text>
<image x="51" y="477" width="158" height="72" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect class="frame" x="51" y="477" width="158" height="72"/>
<rect x="137.18" y="510.60" width="4.79" height="4.80" fill="none" stroke="white" stroke-width="3.5"/><rect class="frame" x="137.18" y="510.60" width="4.79" height="4.80"/>
<text class="dim" x="130" y="579">32 × H/8 × W/8</text>
<path class="arrow" d="M213 514H278"/>
<text class="dim" x="311" y="463">2 × 2</text>
<rect x="286" y="489" width="25" height="25" fill="rgb(111,126,145)"/>
<rect x="311" y="489" width="25" height="25" fill="rgb(117,131,150)"/>
<rect x="286" y="514" width="25" height="25" fill="rgb(192,198,207)"/>
<rect x="311" y="514" width="25" height="25" fill="rgb(108,123,143)"/>
<rect class="frame" x="286" y="489" width="50" height="50"/>
<path class="guide" d="M311 489v50M286 514h50"/>
<text class="dim" x="311" y="579">32 × 2 × 2 = 128</text>
<path class="arrow" d="M341 514H425"/>
<text class="op" x="509" y="463">BN<tspan class="sub">eval</tspan></text>
<image x="431" y="477" width="158" height="72" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect class="frame" x="431" y="477" width="158" height="72"/>
<rect x="517.18" y="510.60" width="4.79" height="4.80" fill="none" stroke="white" stroke-width="3.5"/><rect class="frame" x="517.18" y="510.60" width="4.79" height="4.80"/>
<text class="dim" x="509" y="579">128 × H/16 × W/16</text>
<path class="arrow" d="M594 514H687"/>
<text class="op" x="650" y="503">Flatten</text>
<rect class="frame" x="696" y="476" width="139" height="77"/>
<rect x="697" y="514.73" width="137" height="3" fill="currentColor" fill-opacity=".38"/>
<text class="dim" x="766" y="464">128</text>
<text class="math" x="679" y="539">L</text>
<text class="math" x="766" y="528">E<tspan class="sub">ref</tspan></text>
<text class="dim" x="766" y="579">L = (H/16)(W/16)</text>
<text class="math" x="238" y="620">BN<tspan class="sub">eval</tspan>(x<tspan class="sub">c</tspan>) = (x<tspan class="sub">c</tspan> − μ<tspan class="sub">run,c</tspan>) / √(σ<tspan class="sub">run,c</tspan>² + ε)</text>
<path class="arrow" d="M766 587v6q0 9-9 9H464q-9 0-9 9v8"/>
<text class="math" x="455" y="650">R = E<tspan class="sub">ref</tspan> <tspan fill="#801f2a">W<tspan class="sub">in</tspan><tspan class="sup">⊤</tspan></tspan></text>
<text class="dim" x="455" y="676">L × 128  →  L × 4096</text>
<path class="arrow" d="M455 684v20"/>
<text class="op" x="455" y="734">Block ℓ</text>
<text class="math" x="231" y="734">t<tspan class="sub">ref</tspan> = 0</text>
<path class="arrow" d="M292 726h110"/>
<text class="op" x="689" y="734">RoPE (10, i, j, 0)</text>
<path class="arrow" d="M598 726H509"/>
<path class="arrow" d="M455 744v17"/><text class="dim" x="502" y="759">step 1</text>
<rect class="frame" x="315" y="771" width="280" height="38"/>
<text class="math" x="455" y="798"><tspan class="op">KV cache</tspan>　(K<tspan class="sub">ref</tspan>, V<tspan class="sub">ref</tspan>)<tspan class="sup">ℓ</tspan></text>
<path class="arrow" d="M455 812v17"/><text class="dim" x="527" y="830">steps 1 … T</text>
<text class="math" x="455" y="858">Attn(Q<tspan class="sub">txt,img</tspan>, [K<tspan class="sub">txt</tspan>, K<tspan class="sub">ref</tspan>, K<tspan class="sub">img</tspan>], [V<tspan class="sub">txt</tspan>, V<tspan class="sub">ref</tspan>, V<tspan class="sub">img</tspan>])</text>
</svg>
